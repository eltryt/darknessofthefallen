name: Deploy backend to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run test:backend
      - run: npm run build:backend
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions configuration: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Initialize workers.dev if absent
        id: subdomain
        run: node scripts/cloudflare-subdomain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy public gateway preserving existing storage
        run: npx wrangler deploy --config wrangler.public.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # Raid-Helper is no longer used: the guild's own bot publishes the raid calls.
      - name: Configure Discord bot private messages when its secret is present
        # A bot problem must not block the site deploy; call-ups still save without messages.
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$DISCORD_BOT_TOKEN" ]; then
            node scripts/configure-discord-bot.mjs
          else
            echo 'Discord bot secret not configured; call-ups are saved without private messages.'
          fi
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure off-site backup token when its secret is present
        shell: bash
        run: |
          if [ -n "$BACKUP_TOKEN" ]; then
            node scripts/configure-backup.mjs
          else
            echo 'Backup token not configured; the backup endpoints stay disabled.'
          fi
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure Battle.net sign-in when its secrets are present
        # A problem here must not block the site deploy; the profile button stays disabled.
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$BLIZZARD_CLIENT_ID" ] && [ -n "$BLIZZARD_CLIENT_SECRET" ]; then
            node scripts/configure-battlenet.mjs
          else
            echo 'Battle.net secrets not configured; the profile import stays disabled.'
          fi
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure app notification key when its secret is present
        shell: bash
        run: |
          if [ -n "$VAPID_PRIVATE_JWK" ]; then
            node scripts/configure-push.mjs
          else
            echo 'App notification key not configured; app notifications stay disabled.'
          fi
        env:
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy persistent backend and application assets
        run: npm run deploy:backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public HTTPS application and access controls
        run: node scripts/check-backend.mjs
        env:
          BACKEND_URL: https://darknessofthefallen.com
      - name: Verify Discord uses the public callback
        run: node scripts/check-discord.mjs

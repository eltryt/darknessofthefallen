name: Encrypted off-site backup
on:
  schedule:
    # Daily at 04:17 UTC, outside raid hours.
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offsite-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The repository is public: only the encrypted file leaves this job.
      - name: Download, verify and encrypt the production export
        run: node scripts/backup-remote.mjs offsite
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: darkness-backup-${{ github.run_id }}
          path: offsite/*.json.enc
          retention-days: 90
          if-no-files-found: error

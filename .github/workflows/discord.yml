name: Configure Discord login
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-backend
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test tests/discord-config.test.mjs
      - name: Install Discord credentials without logging values
        run: node scripts/configure-discord.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_LEADER_ID: ${{ secrets.DISCORD_LEADER_ID }}
          # Public role IDs confirmed by the guild owner; credentials remain in Secrets.
          DISCORD_ROLE_MAP: '{"1550998252449435662":"member","1550998241917534248":"raider","1550998186162782218":"raid_leader","1550998307801927802":"officer"}'
      - name: Verify live Discord authorization redirect
        run: node scripts/check-discord.mjs
